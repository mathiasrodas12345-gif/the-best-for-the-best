name: personal-windows

# Windows build for personal use: clang-cl, with ThinLTO and the repo's Ocarina of Time PGO profile.
# Manual runs only, so it never publishes a release and no push can start it.
#
# Inputs (Run workflow):
#   march  CPU target passed as -march=<value>. Default znver3 (Ryzen 5000 series). Leave it empty
#          for a build without -march, to compare against.
#   fast   Skips ThinLTO and PGO. Much quicker to build, but slower to run: use it to check that a
#          change works, never to measure fps.
on:
  workflow_dispatch:
    inputs:
      march:
        description: "-march value (empty = none)"
        type: string
        default: znver3
      fast:
        description: "Fast build without ThinLTO/PGO (for functional checks, not fps)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: personal-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: windows-${{ inputs.march || 'baseline' }}${{ inputs.fast && '-fast' || '' }}
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
      # Part of every cache key: objects built with other flags are never restored.
      VARIANT: ${{ inputs.march || 'baseline' }}-${{ inputs.fast && 'fast' || 'lto' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check PGO profile
        if: ${{ !inputs.fast }}
        shell: bash
        run: test -s lichii-windows.profdata

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools
        shell: pwsh
        run: glslangValidator --version

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: personal-cpm-v1-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            personal-cpm-v1-

      # .sccache holds compiled objects; .ltocache holds ThinLTO's per-module results, so a rebuild
      # after a small change re-optimizes only the modules that changed instead of the whole program.
      - name: Restore compiler caches
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .sccache
            .ltocache
          key: personal-objects-${{ env.VARIANT }}-${{ hashFiles('lichii-windows.profdata') }}-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            personal-objects-${{ env.VARIANT }}-${{ hashFiles('lichii-windows.profdata') }}-v2-

      - name: Configure
        shell: bash
        env:
          MARCH: ${{ inputs.march }}
          FAST: ${{ inputs.fast }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if ! [[ "$MARCH" =~ ^[A-Za-z0-9_.+-]*$ ]]; then
            echo "Invalid -march value: $MARCH"
            exit 1
          fi

          flags="-DWIN32 -D_WINDOWS -DNOMINMAX"
          linkflags=""
          if [ "$FAST" != "true" ]; then
            flags+=" -flto=thin"
            flags+=" -fprofile-use=$(cygpath -m "$PWD/lichii-windows.profdata")"
            flags+=" -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
            flags+=" -Wno-error=backend-plugin"
            linkflags="-lldltocache:$(cygpath -m "$PWD/.ltocache") -lldltocachepolicy:cache_size_bytes=2g"
          fi
          if [ -n "$MARCH" ]; then
            flags+=" -march=$MARCH"
          fi

          # Shown in the window title and on the log's version line.
          label="personal-${MARCH:-baseline}"
          if [ "$FAST" = "true" ]; then label+="-fast"; fi
          label+="-r${RUN_NUMBER}"

          echo "Compiler flags: $flags"
          echo "Linker flags:   $linkflags"
          echo "Fork label:     $label"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            "-DLICHII_FORK_LABEL=$label" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=$linkflags"

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: |
          sccache --zero-stats
          cmake --build build/release --target yuzu --parallel
          sccache --show-stats

      - name: Stop sccache
        if: always() && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler caches
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            .sccache
            .ltocache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Package
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/release/bin/lichii.exe')) {
            throw 'build/release/bin/lichii.exe was not produced'
          }
          windeployqt --release --no-translations build/release/bin/lichii.exe

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: lichii-${{ env.VARIANT }}-r${{ github.run_number }}-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 14
